name: macOS package and MPS tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mps,dev]"
      - name: Run API and available GPU correctness tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s tests -v
      - name: Verify Metal kernel when a GPU is exposed
        env:
          PYTHONPATH: python
        run: python scripts/verify_mps.py
